<header class="bg-white dark:bg-dark-200 border-b border-gray-200 dark:border-dark-400 p-4 flex items-center justify-between">
    <div class="flex items-center">
      <button class="mr-4 text-gray-500 dark:text-gray-400 md:hidden">
        <fa-icon [icon]="faBars"></fa-icon>
      </button>
      <h2 class="text-lg font-semibold">Orders Dashboard</h2>
    </div>
    <div class="flex items-center space-x-4">
      <div class="relative">
        <input type="text" placeholder="Search..." class="pl-10 pr-4 py-2 border border-gray-300 dark:border-dark-400 dark:bg-dark-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        <fa-icon [icon]="faSearch" class="absolute left-3 top-3 text-gray-400"></fa-icon>
      </div>
      <button class="p-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
        <fa-icon [icon]="faBell"></fa-icon>
      </button>
    </div>
  </header>
